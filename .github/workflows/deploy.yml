name: Deploy to GitHub Pages

# 推送到默认分支时自动构建并部署到 GitHub Pages。
# 首次使用：在 GitHub 仓库 Settings → Pages → Build and deployment
# 把 Source 设为 "GitHub Actions" 即可。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # 说明：本仓库把原始素材放在 .gitignore 的 raw-assets/，
        # 已转码的图片（src/assets）与视频/PDF（public/）都已入库，构建无需原图。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
